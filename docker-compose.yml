services:
  db:
    image: postgres:16-alpine
    container_name: forma-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: forma_secret
      POSTGRES_DB: forma
    ports:
      - "5432:5432"
    volumes:
      - forma_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma -d forma"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forma-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://forma:forma_secret@db:5432/forma
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forma-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  forma_pg:
